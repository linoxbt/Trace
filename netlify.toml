# Netlify: the Next.js app (apps/web) through Netlify's Next.js runtime, plus
# the worker's periodic jobs as a scheduled function (apps/web/netlify/tick.mts,
# bundled into netlify/functions/tick.mjs by the build). The base is the app's folder so
# Netlify detects Next.js; pnpm still installs the whole workspace.
# Secrets are set in the Netlify UI, never here.

[build]
  base = "apps/web"
  # Migrations run when the build can reach the database.
  command = "if [ -n \"$DATABASE_URL\" ]; then pnpm --workspace-root db:migrate || echo 'WARNING: migrations not applied (database unreachable from the build)'; fi && pnpm build:tick && pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # The PayPal client ID is public by design: the browser needs it for the
  # PayPal button, so it is in the built pages. The secret never is.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_PAYPAL_CLIENT_ID,PAYPAL_CLIENT_ID"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.tick]
  schedule = "* * * * *" # every minute, UTC

# Sites created through the API don't get the Next.js runtime added
# automatically, so it is named here. Netlify installs its current version.
[[plugins]]
  package = "@netlify/plugin-nextjs"
